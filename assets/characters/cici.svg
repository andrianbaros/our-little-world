<svg viewBox="0 0 200 220" width="400" height="440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ciciBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#F7FAFC" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </radialGradient>
    <radialGradient id="ciciCap" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="205" rx="55" ry="12" fill="rgba(0,0,0,0.12)" />

  {/* Cozy White Twin Nightcap */}
  <path d="M65 80 C56 28 127 15 140 60 Z" fill="url(#ciciCap)" stroke="#CBD5E0" strokeWidth="1.2" />
  <path d="M140 60 C160 55 177 72 172 92" stroke="#CBD5E0" strokeWidth="7" strokeLinecap="round" />
  <circle cx="174" cy="96" r="9" fill="#FFFFFF" stroke="#CBD5E0" strokeWidth="1.5" />
  <circle cx="174" cy="96" r="3" fill="#A0AEC0" />

  {/* Rounded Snow-White Ears */}
  <circle cx="60" cy="82" r="20" fill="#EDF2F7" stroke="#CBD5E0" strokeWidth="1.2" />
  <circle cx="60" cy="82" r="11" fill="#FFFFFF" />
  <circle cx="140" cy="82" r="20" fill="#EDF2F7" stroke="#CBD5E0" strokeWidth="1.2" />
  <circle cx="140" cy="82" r="11" fill="#FFFFFF" />

  {/* Pure White Body */}
  <circle cx="100" cy="132" r="66" fill="url(#ciciBody)" stroke="#E2E8F0" strokeWidth="1.5" />
  <ellipse cx="100" cy="150" rx="43" ry="32" fill="#FFFFFF" opacity="0.95" />

  {/* Sleepy closed eyelids */}
  <path d="M72 121 Q82 129 92 121" stroke="#4A5568" strokeWidth="3.5" strokeLinecap="round" />
  <path d="M108 121 Q118 129 128 121" stroke="#4A5568" strokeWidth="3.5" strokeLinecap="round" />

  {/* Sleepy little yawn mouth */}
  <ellipse cx="100" cy="132" rx="4.5" ry="5.5" fill="#4A5568" />

  {/* Soft Peach/Pink Twin Blush */}
  <ellipse cx="65" cy="131" rx="10" ry="6" fill="#FED7E2" opacity="0.85" />
  <ellipse cx="135" cy="131" rx="10" ry="6" fill="#FED7E2" opacity="0.85" />

  {/* Hugging Marshmallow Cloud Pillow */}
  <g transform="translate(75, 146)">
    <ellipse cx="25" cy="16" rx="26" ry="16" fill="#FFFFFF" stroke="#E2E8F0" strokeWidth="2" />
    <ellipse cx="14" cy="14" rx="13" ry="10" fill="#FFFFFF" />
    <ellipse cx="36" cy="14" rx="13" ry="10" fill="#FFFFFF" />
    {/* Cute Pink Heart on White Pillow */}
    <path
      d="M25 14 C25 11.5 23 9.5 21 9.5 C19.2 9.5 18 10.7 17.5 12 C17 10.7 15.8 9.5 14 9.5 C12 9.5 10 11.5 10 14 C10 16.5 14 19.5 17.5 22 C21 19.5 25 16.5 25 14 Z"
      fill="#FF6B8B"
      transform="scale(0.8) translate(7, 3)"
    />
  </g>

  {/* Pink Heart Chest Badge (female character) */}
  <g transform="translate(92, 172)">
    <path
      d="M8 3 C8 1.3 6.7 0 5 0 C3.8 0 2.7 0.9 2.2 2 C1.7 0.9 0.6 0 -0.6 0 C-2.3 0 -3.6 1.3 -3.6 3 C-3.6 5.5 0 8.5 2.2 11 C4.4 8.5 8 5.5 8 3 Z"
      fill="#FF5E7E"
    />
  </g>

  {/* Floating Soft Cloud zZz */}
  <g opacity="0.85">
    <text x="140" y="50" fill="#718096" fontSize="16" fontWeight="bold">z</text>
    <text x="154" y="35" fill="#A0AEC0" fontSize="21" fontWeight="bold">Z</text>
    <text x="170" y="20" fill="#CBD5E0" fontSize="26" fontWeight="bold">Z</text>
  </g>

  {/* Little Soft Slate Feet */}
  <ellipse cx="78" cy="194" rx="16" ry="10" fill="#CBD5E0" />
  <ellipse cx="122" cy="194" rx="16" ry="10" fill="#CBD5E0" />
</svg>