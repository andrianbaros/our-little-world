<svg viewBox="0 0 200 220" width="400" height="440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="momoBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#FFF0F3" />
      <stop offset="45%" stopColor="#FFA3B5" />
      <stop offset="100%" stopColor="#FF6B8B" />
    </radialGradient>
    <radialGradient id="momoCap" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#FFCCD5" />
      <stop offset="100%" stopColor="#FF5E7E" />
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="205" rx="55" ry="12" fill="rgba(0,0,0,0.12)" />

  {/* Cozy Pink Twin Nightcap */}
  <path d="M65 80 C56 28 127 15 140 60 Z" fill="url(#momoCap)" />
  <path d="M140 60 C160 55 177 72 172 92" stroke="#FF5E7E" strokeWidth="7" strokeLinecap="round" />
  <circle cx="174" cy="96" r="9" fill="#FFF0F3" stroke="#FFA3B5" strokeWidth="1.5" />
  <circle cx="174" cy="96" r="3" fill="#FF3366" />

  {/* Rounded Pink Ears */}
  <circle cx="60" cy="82" r="20" fill="#FF6B8B" />
  <circle cx="60" cy="82" r="11" fill="#FFF0F3" />
  <circle cx="140" cy="82" r="20" fill="#FF6B8B" />
  <circle cx="140" cy="82" r="11" fill="#FFF0F3" />

  {/* Soft Pink Body */}
  <circle cx="100" cy="132" r="66" fill="url(#momoBody)" />
  <ellipse cx="100" cy="150" rx="43" ry="32" fill="#FFF0F3" opacity="0.95" />

  {/* Sleepy closed eyelids */}
  <path d="M72 121 Q82 129 92 121" stroke="#9E1C38" strokeWidth="3.5" strokeLinecap="round" />
  <path d="M108 121 Q118 129 128 121" stroke="#9E1C38" strokeWidth="3.5" strokeLinecap="round" />

  {/* Sleepy little yawn mouth */}
  <ellipse cx="100" cy="132" rx="4.5" ry="5.5" fill="#9E1C38" />

  {/* Rosy Strawberry Blush */}
  <ellipse cx="65" cy="131" rx="10" ry="6" fill="#FF85A1" opacity="0.8" />
  <ellipse cx="135" cy="131" rx="10" ry="6" fill="#FF85A1" opacity="0.8" />

  {/* Hugging Strawberry Marshmallow Cloud Pillow */}
  <g transform="translate(75, 146)">
    <ellipse cx="25" cy="16" rx="26" ry="16" fill="#FFF5F7" stroke="#FFCCD5" strokeWidth="2" />
    <ellipse cx="14" cy="14" rx="13" ry="10" fill="#FFF0F3" />
    <ellipse cx="36" cy="14" rx="13" ry="10" fill="#FFF0F3" />
    {/* Pink Heart on Pillow */}
    <path
      d="M25 14 C25 11.5 23 9.5 21 9.5 C19.2 9.5 18 10.7 17.5 12 C17 10.7 15.8 9.5 14 9.5 C12 9.5 10 11.5 10 14 C10 16.5 14 19.5 17.5 22 C21 19.5 25 16.5 25 14 Z"
      fill="#FF3366"
      transform="scale(0.8) translate(7, 3)"
    />
  </g>

  {/* Pink Heart Chest Badge */}
  <g transform="translate(92, 172)">
    <path
      d="M8 3 C8 1.3 6.7 0 5 0 C3.8 0 2.7 0.9 2.2 2 C1.7 0.9 0.6 0 -0.6 0 C-2.3 0 -3.6 1.3 -3.6 3 C-3.6 5.5 0 8.5 2.2 11 C4.4 8.5 8 5.5 8 3 Z"
      fill="#FF3366"
    />
  </g>

  {/* Floating Pink zZz */}
  <g opacity="0.85">
    <text x="140" y="50" fill="#FF6B8B" fontSize="16" fontWeight="bold">z</text>
    <text x="154" y="35" fill="#FF85A1" fontSize="21" fontWeight="bold">Z</text>
    <text x="170" y="20" fill="#FFA3B5" fontSize="26" fontWeight="bold">Z</text>
  </g>

  {/* Little Pink Feet */}
  <ellipse cx="78" cy="194" rx="16" ry="10" fill="#E53E65" />
  <ellipse cx="122" cy="194" rx="16" ry="10" fill="#E53E65" />
</svg>